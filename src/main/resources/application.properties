spring.application.name=spring-boot-api-verification-demo
server.port=8080

# In-memory H2 database; data is reset on every restart. Default H2 user, no password needed.
spring.datasource.url=jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Strict JSON input: reject what would otherwise be silently accepted.
#   {"id": 5, ...}  -> rejected instead of ignored (clients cannot set server-managed fields)
#   {"age": 25.9}   -> rejected instead of truncated to 25
#   {"age": "25"}   -> rejected instead of coerced to 25
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# Never leak internals through the fallback error page.
server.error.include-stacktrace=never
server.error.include-message=never
